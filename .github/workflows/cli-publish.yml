name: CLI npm Publish
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: CLI version to verify or publish
        required: true
        type: string
      dry_run:
        description: Validate and upload package without publishing
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: cli-npm-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify requested version and branch
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node -e "const p=require('./apps/cli/package.json'); if(p.version!==process.env.EXPECTED_VERSION) throw Error('CLI version differs from requested version'); if(process.env.DRY_RUN!=='true' && process.env.GITHUB_REF!=='refs/heads/main') throw Error('Publishing requires main');"
      - run: npm ci
      - run: npm test
      - run: npm run check:types
      - run: npm run format:check
      - run: npm run version:check
      - run: cargo test --manifest-path packages/storage/Cargo.toml
      - run: cargo test --manifest-path apps/cli/native/Cargo.toml
      - name: Reject an already published version
        if: ${{ !inputs.dry_run }}
        run: node scripts/verify-cli-package.mjs --registry
      - name: Pack the tested Windows build
        run: |
          New-Item -ItemType Directory -Force .local/npm-publish | Out-Null
          $report = npm pack --workspace apps/cli --ignore-scripts --json --pack-destination .local/npm-publish
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $report | Set-Content .local/npm-publish/pack.json -Encoding utf8
          node scripts/verify-cli-package.mjs .local/npm-publish/pack.json
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Smoke test installation from the archive
        run: |
          $archive = @(Get-ChildItem .local/npm-publish/*.tgz)
          if ($archive.Count -ne 1) { throw 'Expected one archive' }
          $install = Join-Path $env:RUNNER_TEMP 'worktree-npm-smoke'
          npm install --prefix $install --ignore-scripts --no-audit --no-fund --package-lock=false $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed' }
          $cli = Join-Path $install 'node_modules/@devpumpkin0113/worktree-cli/dist/main.js'
          node $cli --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          node $cli init --project (Join-Path $install 'project') --yes --json
          if ($LASTEXITCODE -ne 0) { throw 'Installed storage helper failed' }
          node $cli validate --project (Join-Path $install 'project') --json
          if ($LASTEXITCODE -ne 0) { throw 'Installed project validation failed' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: worktree-cli-npm
          path: .local/npm-publish/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  publish:
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v8.0.1
        with:
          name: worktree-cli-npm
          path: package
      - name: Publish the verified archive using npm OIDC
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          $archive = @(Get-ChildItem package/*.tgz)
          if ($archive.Count -ne 1) { throw 'Expected one archive' }
          npm publish $archive[0].FullName --ignore-scripts --access public --provenance
          if ($LASTEXITCODE -ne 0) { throw 'npm publication failed' }
