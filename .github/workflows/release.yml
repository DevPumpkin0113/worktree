name: Windows Release
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release version
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid app version' }
          $tag = "v$version"
          $published = @(gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[] | select(.draft == false) | .tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not check published releases' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($published -contains $tag) {
            'publish=false' >> $env:GITHUB_OUTPUT
            Write-Host "$tag is already published; skipping release."
            exit 0
          }
          git ls-remote --exit-code --tags origin "refs/tags/$tag"
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) { throw 'An unpublished tag already exists; resolve it before releasing' }
          if ($tagStatus -ne 2) { throw 'Could not check remote tags' }
          'publish=true' >> $env:GITHUB_OUTPUT
          exit 0
  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run check:types
      - run: npm run format:check
      - run: npm run version:check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Release and app version differ')"
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WORKTREE_RELEASE_BUILD: '1'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is not configured' }
          npm run tauri build -- --ci --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer build failed' }
          node scripts/update-manifest.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Updater manifest generation failed' }
      - name: Verify installer signature and tamper rejection
        working-directory: src-tauri
        run: cargo test signed_installer_verifies_and_tampering_is_rejected -- --ignored
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Worktree-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'Installer was not generated' }
          $directory = 'src-tauri/target/release/bundle/nsis'
          $signature = $installers[0].FullName + '.sig'
          $manifest = Join-Path $directory 'latest.json'
          if (-not (Test-Path -LiteralPath $signature) -or -not (Test-Path -LiteralPath $manifest)) { throw 'Signed updater artifacts missing' }
          $assets = @($installers.FullName) + @($signature, (Resolve-Path -LiteralPath $manifest).Path)
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --generate-notes --title "Worktree $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
