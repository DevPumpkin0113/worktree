<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worktree</title>
<link rel="stylesheet" href="/schedule-views.css">
<style>
:root{font-family:Segoe UI,Malgun Gothic,sans-serif;color:#243249;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#142338;color:white;padding:28px 5%}header small{color:#90bdce;letter-spacing:3px}h1{margin:10px 0;font-size:28px}header p{color:#bac8d7;font-size:13px;overflow-wrap:anywhere}main{max-width:1450px;margin:auto;padding:26px 4%}button,input,select{font:inherit;border:1px solid #d4dce6;border-radius:8px;padding:9px 13px;background:white;color:#243249}button{cursor:pointer}button:hover,button.active{background:#176b73;color:white;border-color:#176b73}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.metric{background:white;border:1px solid #e0e6ed;border-radius:12px;padding:20px}.metric strong{display:block;font-size:28px;margin-top:8px}.metric span{font-size:12px;color:#617184}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input{flex:1;min-width:180px}.notice{background:#e5f0f2;border-radius:9px;padding:13px 16px;font-size:13px;line-height:1.7;margin-bottom:20px}#content{background:white;border:1px solid #dde4ed;border-radius:12px;padding:20px;min-height:300px}.group{margin:8px 0 20px;border:1px solid #e1e7ee;border-radius:9px;overflow:hidden}summary{cursor:pointer;background:#edf2f7;padding:14px;font-weight:600}.children{padding:6px 14px}.task{display:grid;grid-template-columns:65px 1fr auto;gap:12px;padding:14px 4px;border-bottom:1px solid #edf0f4;cursor:pointer}.task:last-child{border:0}.id{font-family:monospace;color:#617184}.tag{font-size:11px;border-radius:5px;background:#edf1f5;padding:4px 7px;white-space:nowrap;height:fit-content}.done{background:#d8f1e5;color:#187650}.doing{background:#dceafe;color:#265fa1}.blocked{background:#ffe1dd;color:#aa392c}.sub{font-size:12px;color:#718097;margin-top:6px}.lanes{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow:auto}.lane{background:#f4f6f9;border-radius:9px;padding:12px}.lane .task{display:block;background:white;border:1px solid #e0e6ed;border-radius:8px;margin:10px 0;padding:14px}.lane h3{font-size:14px}.flow{overflow:auto}.flow-row{display:flex;align-items:center;gap:14px;margin:12px 0;min-width:620px}.node{border:1px solid #d3e1e7;background:#f1f8f8;padding:12px;border-radius:8px;width:310px;cursor:pointer}.deps{font-size:12px;line-height:1.9;width:280px}.deps button{padding:3px 7px;font-size:12px;margin:2px}.empty{color:#617184;padding:30px;text-align:center}dialog{border:0;border-radius:14px;padding:28px;max-width:650px;width:90%;line-height:1.8}dialog::backdrop{background:#14233899}dialog dl{display:grid;grid-template-columns:100px 1fr;gap:12px}dd{margin:0;overflow-wrap:anywhere}#error{white-space:pre-wrap;color:#a92c29}#timeline{overflow:auto}.bar{height:12px;background:#20838a;border-radius:6px;min-width:3px}footer{font-size:12px;color:#718097;margin-top:18px}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}header{padding:22px}main{padding:18px}.task{grid-template-columns:52px 1fr}.task>.tag{grid-column:2}.metric{padding:14px}}

html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}header.titlebar{height:38px;min-height:38px;padding:0;background:#f9fafc;color:#243249;display:flex;align-items:center;border-bottom:1px solid #dce3eb;user-select:none}header .app-mark{object-fit:contain;font-size:10px;font-weight:800;color:#176b73;letter-spacing:.5px;margin:0 12px 0 16px;pointer-events:none;border:0;border-radius:4px;padding:0}header .title-drag{display:flex;align-items:center;flex:1;min-width:0;height:100%}header h1{font-size:12px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}.window-controls{display:flex;height:100%;flex-shrink:0}.window-controls button{width:46px;border:0;border-radius:0;background:transparent;padding:0;display:grid;place-items:center;color:#435269}.window-controls button:hover{background:#e5eaf0;color:#243249}.window-controls button:last-child:hover{background:#c42b1c;color:white}.window-controls svg{width:12px;height:12px;pointer-events:none;fill:none;stroke:currentColor;stroke-width:1}.window-controls button:focus-visible{outline:2px solid #176b73;outline-offset:-3px}main{flex:1;min-height:0;width:100%;max-width:1450px;overflow:auto;margin:0 auto;padding:20px 28px}.document-dock{display:flex;align-items:stretch;height:36px;min-height:36px;background:#e9eef4;border-top:1px solid #d0d9e4;gap:8px;padding:0 12px}.dock-label{display:flex;align-items:center;font-size:11px;color:#66778b;padding-right:6px;flex-shrink:0}#tabs{display:flex;align-items:stretch;overflow-x:auto;min-width:0;gap:3px;scrollbar-width:thin;flex:1}.document-tab{display:flex;align-items:center;flex-shrink:0;max-width:240px;border:1px solid transparent;border-top:2px solid transparent;margin:0 0 3px;border-radius:0 0 5px 5px}.document-tab.selected{background:white;border-color:#d0d9e4;border-top-color:#176b73}.document-tab button{border:0;border-radius:3px;background:transparent;font-size:11px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#57677c}.document-tab.selected button[data-tab]{color:#175e67;font-weight:600}.document-tab button:hover{background:#dce5ee;color:#243249}.document-tab .tab-close{font-size:15px;width:24px;padding:0;margin-right:3px;flex-shrink:0}.dock-open{border:0;background:transparent;padding:0 10px;border-radius:0;font-size:17px;color:#53677e}.dock-empty{font-size:11px;color:#718097;align-self:center}.source-status{display:block;font-size:11px;color:#718097;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px}.metrics{gap:10px;margin-bottom:16px}.metric{padding:13px 16px}.metric strong{font-size:23px;margin-top:4px}.notice{padding:9px 12px;margin-bottom:14px}footer{margin-top:12px;font-size:11px}@media(max-width:800px){main{padding:16px}.dock-label{display:none}}
.task{grid-template-columns:minmax(90px,max-content) minmax(0,1fr) auto}.id{overflow-wrap:anywhere;max-width:240px}#settings{max-width:480px}#settings h2{font-size:20px;margin-top:0}#settings label{margin-right:16px}#settingsError{color:#a92c29}@media(max-width:700px){.task{grid-template-columns:100px minmax(0,1fr)}}
.header-actions{display:flex;align-items:center;gap:2px;padding:0 9px;margin-right:4px;border-right:1px solid #dce3eb;flex-shrink:0}.header-actions button{width:30px;height:28px;display:grid;place-items:center;border:0;border-radius:5px;background:transparent;padding:0;color:#617184}.header-actions button:hover{background:#e5eaf0;color:#176b73}.header-actions button:disabled{opacity:.35;cursor:default;background:transparent}.header-actions button:focus-visible{outline:2px solid #176b73;outline-offset:-2px}.header-actions svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

.app-version{text-align:center;color:#718097;font-size:12px;margin:18px 0 0;padding-top:14px;border-top:1px solid #e1e7ee}
.settings-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}#settings .settings-heading h2{margin:0}.modal-close{display:grid;place-items:center;flex-shrink:0;width:30px;height:30px;padding:0;border:0;background:transparent;border-radius:6px;color:#617184}.modal-close:hover{background:#edf1f5;color:#243249}.modal-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;pointer-events:none}
.view-button{display:grid;place-items:center;width:42px;height:42px;padding:4px;border-radius:8px;flex-shrink:0}.view-button:hover{background:#edf3f4;border-color:#adc6c8}.view-button.active{background:#dfecef;border-color:#73969a;box-shadow:inset 0 0 0 1px #73969a}.view-button:focus-visible{outline:2px solid #176b73;outline-offset:2px}.view-button{color:#526d70}.view-button:hover,.view-button.active{color:#3f6267}.view-icon{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
</style>
<header class="titlebar"><img class="app-mark" src="/worktree-icon.png" alt="" width="20" height="20"><div id="titleDrag" class="title-drag"><h1 id="title">Worktree</h1></div><div class="header-actions" role="group" aria-label="문서 도구"><button id="reload" aria-label="원본 새로고침" title="원본 새로고침" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg></button><button id="settingsOpen" aria-haspopup="dialog" aria-label="설정" title="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.5 2-2 .9-1.8-.5-2 3.4 1.5 1.4v2.4l-1.5 1.5 2 3.4 1.8-.5 2 .9.5 2h4l.5-2 2-.9 1.8.5 2-3.4-1.5-1.5v-2.4l1.5-1.4-2-3.4-1.8.5-2-.9-.5-2z"/><circle cx="11.5" cy="11.5" r="3"/></svg></button></div><div class="window-controls"><button id="windowMinimize" aria-label="최소화" title="최소화"><svg viewBox="0 0 12 12"><path d="M1 6.5h10"/></svg></button><button id="windowMaximize" aria-label="최대화" title="최대화"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button><button id="windowClose" aria-label="창 닫기" title="닫기"><svg viewBox="0 0 12 12"><path d="m1.5 1.5 9 9m0-9-9 9"/></svg></button></div></header>
<main><div class="metrics" id="metrics"></div><div class="notice" id="notice"></div>
<div class="tools"><button data-view="tree" class="view-button active" title="트리" aria-label="트리" aria-pressed="true"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8" y="3" width="8" height="5" rx="1"/><path d="M12 8v5M5 16v-3h14v3"/><rect x="2" y="16" width="6" height="5" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/></svg></button><button data-view="board" class="view-button" title="칸반" aria-label="칸반" aria-pressed="false"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/><rect x="5" y="6" width="2" height="4" rx=".5"/><rect x="11" y="6" width="2" height="4" rx=".5"/><rect x="17" y="6" width="2" height="4" rx=".5"/><rect x="5" y="13" width="2" height="4" rx=".5"/><rect x="17" y="13" width="2" height="4" rx=".5"/></svg></button><button data-view="flow" class="view-button" title="작업 네트워크" aria-label="작업 네트워크" aria-pressed="false"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="12" r="3"/><path d="m8 6.5 7 3.5m-2-3 2 3-3 .5M8 17.5l7-3.5m-3-.5 3 .5-2 3"/></svg></button><button data-view="gantt" class="view-button" title="간트 차트" aria-label="간트 차트" aria-pressed="false"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3v18h18"/><rect x="6" y="5" width="8" height="3" rx="1"/><rect x="10" y="10" width="9" height="3" rx="1"/><rect x="15" y="15" width="6" height="3" rx="1"/></svg></button><input id="search" aria-label="작업 검색" placeholder="ID, 작업명, 담당자 검색"><select id="status" aria-label="상태 필터"><option value="all">전체 상태</option><option value="todo">시작 전</option><option value="doing">진행 중</option><option value="blocked">막힘</option><option value="done">완료</option></select></div>
<p id="error" role="alert"></p><div id="content"></div><footer><span id="source" class="source-status">WBS 문서를 열거나 이 창으로 끌어오세요.</span>읽기 전용 미리보기 · 작업을 누르면 완료 기준과 선행 조건을 확인할 수 있습니다. 원본 저장 시 자동으로 갱신됩니다.</footer></main><nav class="document-dock" aria-label="열린 문서"><span class="dock-label">문서</span><div id="tabs"></div><button id="dockOpen" class="dock-open" aria-label="문서 열기" title="문서 열기">+</button></nav>
<dialog id="detail"><button id="close" style="float:right">닫기</button><h2 id="detailTitle"></h2><dl id="detailBody"></dl></dialog>
<dialog id="settings" aria-labelledby="settingsTitle"><div class="settings-heading"><h2 id="settingsTitle">설정</h2><button id="settingsClose" class="modal-close" aria-label="설정 닫기" title="닫기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button></div><p>변경하면 바로 적용되며, 앱을 다시 실행해도 유지됩니다.</p><label for="idSeparator">ID 구분자</label><select id="idSeparator"><option value="none">없음</option><option value="hyphen">하이픈 (-)</option></select><p id="idPreview" class="notice"></p><p class="sub">표시 방식만 바뀝니다. 문서의 ID와 작업 연결은 유지됩니다.</p><p id="settingsError" role="alert"></p><p class="app-version" id="appVersion" aria-live="polite">Worktree · 버전 확인 중</p></dialog>
<script type="module">
import {parseWbs} from './model.mjs';
import {bindChartPan} from './chart-pan.mjs';
import {renderDependencies,renderGantt} from './schedule-views.mjs';
import {createIdLabels,readSeparator,saveSeparator} from './id-display.mjs';
import {invoke} from '@tauri-apps/api/core';
import {getVersion} from '@tauri-apps/api/app';
import {setupWindowFrame,setWindowTitle} from './window-frame.mjs';
const documents=new Map();let activePath=null,polling=false;
function tabs(){ $('reload').disabled=!activePath; $('tabs').innerHTML=[...documents.keys()].map((path,i)=>{
let title=path.split(/[\\/]/).pop();try{title=parseWbs(documents.get(path)).title;}catch{}
return `<div class="document-tab ${path===activePath?'selected':''}" title="${esc(path)}"><button data-tab="${i}" aria-pressed="${path===activePath}">${esc(title)}</button><button class="tab-close" data-close-tab="${i}" aria-label="${esc(title)} 문서 닫기">×</button></div>`;
}).join('')||'<span class="dock-empty">열린 문서 없음</span>'; }
async function openPath(path){try{const text=await invoke('read_document',{path});documents.set(path,text);activePath=path;load(text,path);tabs();}catch(e){$('error').textContent=String(e);}}

let model,view='tree',idLabels=new Map(),graphFocus=null,ganttUnit='day';
const storage={getItem:key=>window.localStorage.getItem(key),setItem:(key,value)=>window.localStorage.setItem(key,value)};
let separator=readSeparator(storage);
const label=id=>idLabels.get(id)||id;
const $=id=>document.getElementById(id),labels={todo:'시작 전',doing:'진행 중',blocked:'막힘',done:'완료'},types={task:'작업',milestone:'마일스톤',group:'그룹'};
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=r=>`<span class="tag ${r.status}">${labels[r.status]}</span>`;
function matches(r){const q=$('search').value.trim().toLowerCase();return [r.id,label(r.id),r.name,r.owner].join(' ').toLowerCase().includes(q)&&($('status').value==='all'||r.status===$('status').value);}
function card(r){return `<div class="task" tabindex="0" role="button" data-id="${r.id}"><span class="id">${esc(label(r.id))}</span><div>${r.type==='milestone'?'◇ ':''}${esc(r.name)}<div class="sub">${types[r.type]} · ${r.owner==='-'?'담당 미정':esc(r.owner)}</div></div>${badge(r)}</div>`;}
function show(id){const r=model.rows.find(x=>x.id===id);if(!r)return;$('detailTitle').textContent=`${label(r.id)} · ${r.name}`;$('detailBody').innerHTML=[['원본 ID',r.id],['상위 ID',r.parent==='-'?'없음':label(r.parent)],['유형',types[r.type]],['상태',labels[r.status]],['완료 기준',r.criteria],['담당자',r.owner==='-'?'미정':r.owner],['일정',r.start==='-'?'미정':`${r.start} ~ ${r.end}`],['예상 공수',r.effort==='-'?'미정':`${r.effort}h`],['선행 작업',r.deps.map(id=>label(id)+' '+model.rows.find(x=>x.id===id).name).join(', ')||'없음']].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');$('detail').showModal();}
function render(){if(!model)return;idLabels=createIdLabels(model,separator);const rows=model.rows,leaves=rows.filter(r=>r.type!=='group'),tasks=leaves.filter(r=>r.type==='task'),known=tasks.every(r=>r.effort!=='-'),total=tasks.reduce((n,r)=>n+(Number(r.effort)||0),0),progress=known&&total?Math.round(tasks.filter(r=>r.status==='done').reduce((n,r)=>n+Number(r.effort),0)/total*100)+'%':'산정 불가';
$('metrics').innerHTML=[['작업',tasks.length+'개'],['마일스톤',leaves.filter(r=>r.type==='milestone'&&r.status==='done').length+' / '+leaves.filter(r=>r.type==='milestone').length],['완료 작업',tasks.filter(r=>r.status==='done').length+' / '+tasks.length],['공수 기준 진척도',progress]].map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('');
const missing=leaves.filter(r=>r.start==='-').length;$('notice').textContent=`구조 검사 통과 · ${rows.filter(r=>r.type==='group').length}개 그룹 · 일정 미정 ${missing}개 · 공수 미정 ${tasks.filter(r=>r.effort==='-').length}개. 미정 값은 일정이나 진척도로 추정하지 않습니다.`;
const filtered=leaves.filter(matches);let html='';
if(view==='tree'){const branch=parent=>rows.filter(r=>r.parent===parent).map(r=>{if(r.type!=='group')return matches(r)?card(r):'';const children=branch(r.id);return children?`<details class="group" open><summary>${esc(label(r.id))} · ${esc(r.name)} <span class="tag ${r.status}">${labels[r.status]}</span></summary><div class="children">${children}</div></details>`:'';}).join('');html=branch('-');}
if(view==='board')html='<div class="lanes">'+Object.entries(labels).map(([status,label])=>`<section class="lane"><h3>${label} · ${filtered.filter(r=>r.status===status).length}</h3>${filtered.filter(r=>r.status===status).map(card).join('')}</section>`).join('')+'</div>';
if(view==='flow')html=renderDependencies(leaves,filtered,graphFocus,label);
if(view==='gantt')html=renderGantt(filtered,label,ganttUnit,undefined,$('content').clientWidth||960);
const collisions=model.rows.filter(r=>label(r.id).includes('[')).length;if(collisions)$('notice').textContent+=' 표시 ID 중복 '+collisions+'개: 원본 ID를 함께 표시합니다.';
$('content').innerHTML=html||'<div class="empty">조건에 맞는 작업이 없습니다.</div>';}
function load(markdown,source){graphFocus=null;$('title').textContent=source.split(/[\\/]/).pop();$('source').textContent=source;setWindowTitle($('title').textContent);try{model=parseWbs(markdown);$('title').textContent=model.title;setWindowTitle(model.title);tabs();$('source').textContent=source;$('error').textContent='';render();}catch(e){model=null;$('error').textContent=e.message;$('content').replaceChildren();$('metrics').replaceChildren();$('notice').textContent='문서 오류를 수정한 뒤 다시 불러와 주세요.';}}
async function reload(){if(activePath)await openPath(activePath);}
async function poll(){if(polling)return;polling=true;try{const paths=await invoke('take_open_requests');for(const path of paths)await openPath(path);if(activePath){const path=activePath;try{const text=await invoke('read_document',{path});if(path===activePath&&documents.get(path)!==text){documents.set(path,text);load(text,path);}}catch(e){$('error').textContent='원본 갱신 실패: '+String(e);}}}catch(e){$('error').textContent=String(e);}finally{polling=false;}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});render();});
$('search').oninput=render;$('status').onchange=render;$('reload').onclick=reload;$('dockOpen').onclick=async()=>{try{const path=await invoke('pick_document');if(path)await openPath(path);}catch(e){$('error').textContent=String(e);}};$('close').onclick=()=>$('detail').close();
function activateContent(target){
 if(target?.dataset.select){const scroll=$('content').querySelector?.('.diagram-scroll');const left=scroll?.scrollLeft||0,top=scroll?.scrollTop||0;graphFocus=target.dataset.select;render();const next=$('content').querySelector?.('.diagram-scroll');if(next){next.scrollLeft=left;next.scrollTop=top;}}
 else if(target&&'clearFocus' in target.dataset){graphFocus=null;render();}
 else if(target?.dataset.id)show(target.dataset.id);
}
const chartPan=bindChartPan($('content'));
$('content').onclick=e=>{if(!chartPan.consumeClick())activateContent(e.target.closest('[data-select],[data-id],[data-clear-focus]'));};
$('content').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&(e.target.dataset.id||e.target.dataset.select)){e.preventDefault();activateContent(e.target);}};
$('content').ondblclick=e=>{const target=e.target.closest('[data-select]');if(target?.dataset.select)show(target.dataset.select);};
$('content').onchange=e=>{if(e.target.id==='ganttUnit'){ganttUnit=e.target.value;render();}};
$('tabs').onclick=e=>{const close=e.target.closest('[data-close-tab]'),tab=e.target.closest('[data-tab]');if(close){const path=[...documents.keys()][Number(close.dataset.closeTab)];documents.delete(path);if(path===activePath){activePath=[...documents.keys()].at(-1)||null;if(activePath)load(documents.get(activePath),activePath);else{model=null;$('title').textContent='Worktree';setWindowTitle('Worktree');$('source').textContent='파일을 열거나 이 창으로 끌어오세요.';$('content').replaceChildren();$('metrics').replaceChildren();$('notice').textContent='';$('error').textContent='';}}tabs();}else if(tab){activePath=[...documents.keys()][Number(tab.dataset.tab)];load(documents.get(activePath),activePath);tabs();}};
$('notice').textContent='우측 하단 + 버튼 또는 드래그 앤 드롭으로 시작하세요. 프로젝트명.wbs 파일을 열어 주세요.';
setupWindowFrame(error=>{$('error').textContent='창 제어 실패: '+String(error);});
tabs();

function previewIds(){const prefix=model?.idPrefix||'W';$('idPreview').textContent='미리보기: '+prefix+($('idSeparator').value==='hyphen'?'-':'')+'001';}
async function updateAppVersion(){try{$('appVersion').textContent='Worktree · v'+await getVersion();}catch{$('appVersion').textContent='Worktree · 버전 정보를 불러오지 못했습니다.';}}
$('settingsOpen').onclick=()=>{updateAppVersion();$('idSeparator').value=separator;$('settingsError').textContent='';previewIds();$('settings').showModal();};
$('idSeparator').onchange=()=>{try{saveSeparator(storage,$('idSeparator').value);separator=$('idSeparator').value;$('settingsError').textContent='';previewIds();render();}catch(error){$('idSeparator').value=separator;previewIds();$('settingsError').textContent='설정을 저장하지 못했습니다: '+String(error);}};
$('settingsClose').onclick=()=>$('settings').close();
for(const dialog of [$('detail'),$('settings')]){
 let pressedOutside=false;
 const isBackdrop=event=>{const rect=dialog.getBoundingClientRect();return event.target===dialog&&(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom);};
 dialog.onpointerdown=event=>{pressedOutside=event.button===0&&isBackdrop(event);};
 dialog.onpointercancel=()=>{pressedOutside=false;};
 dialog.onclick=event=>{const shouldClose=pressedOutside&&isBackdrop(event);pressedOutside=false;if(shouldClose)dialog.close();};
}



poll();setInterval(poll,1500);

</script></html>
