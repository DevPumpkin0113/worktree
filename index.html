<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worktree</title>


<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/schedule-views.css">
<link rel="stylesheet" href="/src/styles/task-detail.css">
<header class="titlebar"><img class="app-mark" src="/worktree-icon.png" alt="" width="20" height="20"><div id="titleDrag" class="title-drag"><h1 id="title">Worktree</h1></div><div class="header-actions" role="group" aria-label="문서 도구"><button id="reload" aria-label="원본 새로고침" title="원본 새로고침" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg></button><button id="settingsOpen" aria-haspopup="dialog" aria-label="설정" title="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.5 2-2 .9-1.8-.5-2 3.4 1.5 1.4v2.4l-1.5 1.5 2 3.4 1.8-.5 2 .9.5 2h4l.5-2 2-.9 1.8.5 2-3.4-1.5-1.5v-2.4l1.5-1.4-2-3.4-1.8.5-2-.9-.5-2z"/><circle cx="11.5" cy="11.5" r="3"/></svg></button></div><div class="window-controls"><button id="windowMinimize" aria-label="최소화" title="최소화"><svg viewBox="0 0 12 12"><path d="M1 6.5h10"/></svg></button><button id="windowMaximize" aria-label="최대화" title="최대화"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button><button id="windowClose" aria-label="창 닫기" title="닫기"><svg viewBox="0 0 12 12"><path d="m1.5 1.5 9 9m0-9-9 9"/></svg></button></div></header>
<main><div class="metrics" id="metrics"></div><div class="notice" id="notice"></div>
<div class="tools"><button data-view="tree" class="view-button active" title="트리" aria-label="트리" aria-pressed="true"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8" y="3" width="8" height="5" rx="1"/><path d="M12 8v5M5 16v-3h14v3"/><rect x="2" y="16" width="6" height="5" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/></svg></button><button data-view="board" class="view-button" title="칸반" aria-label="칸반" aria-pressed="false"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/><rect x="5" y="6" width="2" height="4" rx=".5"/><rect x="11" y="6" width="2" height="4" rx=".5"/><rect x="17" y="6" width="2" height="4" rx=".5"/><rect x="5" y="13" width="2" height="4" rx=".5"/><rect x="17" y="13" width="2" height="4" rx=".5"/></svg></button><button data-view="flow" class="view-button" title="작업 네트워크" aria-label="작업 네트워크" aria-pressed="false"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="12" r="3"/><path d="m8 6.5 7 3.5m-2-3 2 3-3 .5M8 17.5l7-3.5m-3-.5 3 .5-2 3"/></svg></button><button data-view="gantt" class="view-button" title="간트 차트" aria-label="간트 차트" aria-pressed="false"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3v18h18"/><rect x="6" y="5" width="8" height="3" rx="1"/><rect x="10" y="10" width="9" height="3" rx="1"/><rect x="15" y="15" width="6" height="3" rx="1"/></svg></button><input id="search" aria-label="작업 검색" placeholder="ID, 작업명, 담당자 검색"><select id="status" aria-label="상태 필터"><option value="all">전체 상태</option><option value="todo">시작 전</option><option value="doing">진행 중</option><option value="blocked">막힘</option><option value="done">완료</option></select></div>
<p id="error" role="alert"></p><div id="content"></div><footer><span id="source" class="source-status">WBS 문서를 열거나 이 창으로 끌어오세요.</span>읽기 전용 미리보기 · 작업을 누르면 완료 기준과 선행 조건을 확인할 수 있습니다. 원본 저장 시 자동으로 갱신됩니다.</footer></main><nav class="document-dock" aria-label="열린 문서"><span class="dock-label">문서</span><div id="tabs"></div><button id="dockOpen" class="dock-open" aria-label="문서 열기" title="문서 열기">+</button></nav>
<dialog id="detail" aria-labelledby="detailTitle"><header class="detail-header"><div class="detail-heading"><div id="detailMeta"></div><h2 id="detailTitle"></h2></div><button id="close" class="modal-close" aria-label="작업 상세 닫기" title="닫기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button></header><div id="detailBody"></div><div class="detail-footer"><p>읽기 전용 · 내용과 상태는 원본 WBS 문서에서 수정할 수 있습니다.</p></div></dialog>
<dialog id="settings" aria-labelledby="settingsTitle"><div class="settings-heading"><h2 id="settingsTitle">설정</h2><button id="settingsClose" class="modal-close" aria-label="설정 닫기" title="닫기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button></div><p>변경하면 바로 적용되며, 앱을 다시 실행해도 유지됩니다.</p><label for="idSeparator">ID 구분자</label><select id="idSeparator"><option value="none">없음</option><option value="hyphen">하이픈 (-)</option></select><p id="idPreview" class="notice"></p><p class="sub">표시 방식만 바뀝니다. 문서의 ID와 작업 연결은 유지됩니다.</p><p id="settingsError" role="alert"></p><p class="app-version" id="appVersion" aria-live="polite">Worktree · 버전 확인 중</p></dialog>
