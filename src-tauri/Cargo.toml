[package]
name = "worktree"
version = "0.20.0"
description = "Markdown WBS desktop viewer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
open = "5"
tempfile = "3"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
